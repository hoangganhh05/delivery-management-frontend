<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="viettelRed" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff1a40" />
      <stop offset="50%" stop-color="#ee0033" />
      <stop offset="100%" stop-color="#a60022" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="url(#viettelRed)" />
  
  <!-- Subtle Inner Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Delivery Package / Express Icon -->
  <g filter="url(#glow)" transform="translate(12, 12)">
    <!-- Truck Body / Package -->
    <path
      d="M4 8C4 5.79086 5.79086 4 8 4H24C26.2091 4 28 5.79086 28 8V24C28 26.2091 26.2091 28 24 28H8C5.79086 28 4 26.2091 4 24V8Z"
      fill="#ffffff"
    />
    <!-- Box Flaps / Tape (Viettel Red detail) -->
    <path
      d="M16 4V28M4 14H28"
      stroke="#ee0033"
      stroke-width="2.5"
      stroke-linecap="round"
    />
    <!-- Fast Motion Wings / Speed Lines -->
    <path
      d="M32 9L37 9M30 16L39 16M32 23L36 23"
      stroke="#ffffff"
      stroke-width="2.5"
      stroke-linecap="round"
    />
    <!-- Top Right Sparkle Star -->
    <circle cx="28" cy="4" r="2.5" fill="url(#goldAccent)" />
  </g>
</svg>